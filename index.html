<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live ArUco Tracker</title>
    <script src="https://cdn.rawgit.com/damianofalcioni/js-aruco2/master/src/aruco.js"></script>
    <script src="https://cdn.rawgit.com/damianofalcioni/js-aruco2/master/src/cv.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        video { width: 100%; max-width: 600px; transform: scaleX(-1); background: #333; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; position: absolute; }
        #hiddenCanvas { display: none; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <button id="startBtn">START CAMERA</button>
    <canvas id="hiddenCanvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');
        const detector = new AR.Detector({ dictionaryName: 'ARUCO' });

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: 'environment' } } 
                });
                video.srcObject = stream;
                await video.play();
                startBtn.style.display = 'none';

                video.onloadedmetadata = () => {
                    hiddenCanvas.width = video.videoWidth;
                    hiddenCanvas.height = video.videoHeight;
                    requestAnimationFrame(processFrame);
                };
            } catch (err) {
                alert("Error: " + err.message);
            }
        });

        function processFrame() {
            // Copy the live frame to the hidden processing canvas
            hiddenCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            let imageData = hiddenCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
            
            // Detect markers
            let markers = detector.detect(imageData);

            // Log to console so you can verify it's working
            if (markers.length > 0) {
                console.log("Marker Found! ID:", markers[0].id);
            }
            
            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
