<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Camera Stream + ArUco</title>
    <script src="https://cdn.rawgit.com/damianofalcioni/js-aruco2/master/src/aruco.js"></script>
    <script src="https://cdn.rawgit.com/damianofalcioni/js-aruco2/master/src/cv.js"></script>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #000; }
        /* Your working video setup */
        video { width: 100%; max-width: 600px; transform: scaleX(-1); }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; position: absolute; }
        /* Hidden canvas for processing */
        #hiddenCanvas { display: none; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <button id="startBtn">Start Camera</button>
    <canvas id="hiddenCanvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');
        const detector = new AR.Detector({ dictionaryName: 'ARUCO' });

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: 'environment' } } 
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                
                // Once video starts, wait for metadata then start loop
                video.onloadedmetadata = () => {
                    hiddenCanvas.width = video.videoWidth;
                    hiddenCanvas.height = video.videoHeight;
                    requestAnimationFrame(processFrame);
                };
            } catch (err) {
                alert("Error: " + err);
            }
        });

        function processFrame() {
            // 1. Copy live video frame to hidden canvas
            hiddenCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            
            // 2. Extract image data
            let imageData = hiddenCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
            
            // 3. Detect
            let markers = detector.detect(imageData);

            // 4. Report
            if (markers.length > 0) {
                console.log("Detected Marker ID:", markers[0].id);
                // You can add an alert or update an element here
            }
            
            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
