<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Dependency Tracker</title>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #container { position: relative; width: 100%; max-width: 600px; }
        video { width: 100%; display: block; background: #333; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; z-index: 10; font-size: 18px; }
    </style>
</head>
<body>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <button id="btn">START CAMERA</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('btn');
        
        let barcodeDetector;

        // Initialize the browser's native detector if available
        if ('BarcodeDetector' in window) {
            barcodeDetector = new BarcodeDetector({ formats: ['qr_code', 'data_matrix'] });
        }

        btn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: 'environment' } } 
                });
                video.srcObject = stream;
                await video.play();
                btn.style.display = 'none';

                // Set explicit canvas dimensions to match video aspect ratio
                canvas.width = 640;
                canvas.height = 480;
                
                requestAnimationFrame(loop);
            } catch (err) {
                alert("Camera Access Failed: " + err.name + "\n" + err.message);
            }
        };

        async function loop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // If native detector is supported, look for markers/QR codes
                if (barcodeDetector) {
                    try {
                        const barcodes = await barcodeDetector.detect(video);
                        
                        ctx.strokeStyle = "red";
                        ctx.lineWidth = 5;
                        
                        barcodes.forEach(barcode => {
                            const pts = barcode.cornerPoints;
                            ctx.beginPath();
                            ctx.moveTo(pts[0].x, pts[0].y);
                            ctx.lineTo(pts[1].x, pts[1].y);
                            ctx.lineTo(pts[2].x, pts[2].y);
                            ctx.lineTo(pts[3].x, pts[3].y);
                            ctx.closePath();
                            ctx.stroke();
                        });
                    } catch (e) {
                        console.error("Detection error:", e);
                    }
                }
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
