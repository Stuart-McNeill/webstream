<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minimal Camera Test</title>
    <style>
        body { background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        video { width: 100%; max-width: 500px; border: 2px solid green; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <button id="btn" style="padding: 20px;">START</button>

    <script>
        const video = document.getElementById('video');
        const btn = document.getElementById('btn');

        btn.onclick = () => {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'environment' } } })
            .then(stream => {
                video.srcObject = stream;
                btn.style.display = 'none';
            })
            .catch(err => {
                alert("CRITICAL ERROR: " + err.name + " - " + err.message);
            });
        };
    </script>
</body>
</html>
