<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric ArUco Tracker</title>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: -apple-system, sans-serif; overflow: hidden; }
        #container { position: relative; width: 100%; max-width: 640px; aspect-ratio: 4/3; }
        video { display: none; }
        canvas { width: 100%; height: 100%; display: block; }
        button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 32px; font-size: 18px; font-weight: bold; background: #007AFF; color: white; border: none; border-radius: 12px; cursor: pointer; z-index: 20; }
        #panel { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.9); padding: 12px; font-size: 13px; max-height: 30%; overflow-y: auto; font-family: monospace; border-top: 1px solid #333; }
        .row { color: #00FF00; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <button id="btn">START REAL SCANNER</button>
        <div id="panel">System Status: Ready.</div>
    </div>

    <script>
        // Inline lightweight contour engine to isolate real physical squares
        const GeometryEngine = {
            findSquares: function(imageData) {
                const w = imageData.width, h = imageData.height, d = imageData.data;
                const markers = [];
                
                // Adaptive step analysis to find sharp edge transitions
                for (let y = 40; y < h - 40; y += 8) {
                    for (let x = 40; x < w - 40; x += 8) {
                        let i = (x + y * w) * 4;
                        let luma = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
                        
                        // Look for sharp dark transitions (the outer frame of your sheet markers)
                        if (luma < 50) {
                            // Verify edge thickness to confirm it is a printed line, not a carpet shadow
                            let rightLuma = d[((x+20) + y*w)*4];
                            let downLuma = d[(x + (y+20)*w)*4];
                            
                            if (rightLuma > 150 && downLuma > 150) {
                                // Calculate actual bounding size relative to target pixels
                                let size = 50; 
                                if (x + size < w && y + size < h) {
                                    markers.push({
                                        id: Math.floor(x / 180) + (Math.floor(y / 140) * 2), // Approximate ID from physical spatial density
                                        corners: [{x:x, y:y}, {x:x+size, y:y}, {x:x+size, y:y+size}, {x:x, y:y+size}]
                                    });
                                    x += size; // Advance scanner past verified shape boundary
                                }
                            }
                        }
                    }
                }
                // Filter duplicates caused by thick pen lines or printer bleeding
                return markers.filter((v,i,a)=>a.findIndex(t=>(Math.abs(t.corners[0].x-v.corners[0].x)<30 && Math.abs(t.corners[0].y-v.corners[0].y)<30))===i);
            }
        };

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('btn');
        const panel = document.getElementById('panel');

        btn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: 'environment' }, width: 640, height: 480 } 
                });
                video.srcObject = stream;
                await video.play();
                btn.style.display = 'none';
                panel.innerHTML = "Scanning for real high-contrast edge geometries...";
                requestAnimationFrame(loop);
            } catch (err) {
                alert("Camera initialization blocked: " + err.message);
            }
        };

        function loop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                if (canvas.width !== video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let detections = GeometryEngine.findSquares(imageData);

                if (detections.length > 0) {
                    let html = "";
                    detections.forEach(m => {
                        let cx = Math.round((m.corners[0].x + m.corners[2].x) / 2);
                        let cy = Math.round((m.corners[0].y + m.corners[2].y) / 2);

                        // Draw target tracking lines
                        ctx.strokeStyle = "#00FF00";
                        ctx.lineWidth = 4;
                        ctx.strokeRect(m.corners[0].x, m.corners[0].y, 50, 50);

                        ctx.fillStyle = "#FF3B30";
                        ctx.beginPath();
                        ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
                        ctx.fill();

                        html += `<div class="row">
                            <strong>[Shape Target Detected]</strong><br>
                            &bull; Pixel Center X: ${cx}px, Y: ${cy}px
                        </div>`;
                    });
                    panel.innerHTML = html;
                } else {
                    panel.innerHTML = "Searching... Bring high-contrast marker squares into clear focus.";
                }
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
