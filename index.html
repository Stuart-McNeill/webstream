<!DOCTYPE html>
<html lang="en">
<body>
    <video id="video" width="640" height="480" autoplay playsinline style="transform: scaleX(-1);"></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    
    <script src="https://docs.opencv.org/4.x/opencv.js"></script>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { exact: 'environment' } } 
            });
            video.srcObject = stream;
            
            // Wait for video to be ready
            video.onloadedmetadata = () => {
                requestAnimationFrame(processVideo);
            };
        }

        function processVideo() {
            let cap = new cv.VideoCapture(video);
            let frame = new cv.Mat(video.height, video.width, cv.CV_8UC4);
            let gray = new cv.Mat();
            
            cap.read(frame);
            cv.cvtColor(frame, gray, cv.COLOR_RGBA2GRAY);

            // ArUco Detection
            try {
                let dictionary = new cv.getPredefinedDictionary(cv.DICT_4X4_50);
                let detector = new cv.ArucoDetector(dictionary);
                let corners = new cv.MatVector();
                let ids = new cv.Mat();
                
                detector.detectMarkers(gray, corners, ids);
                
                if (ids.rows > 0) {
                    cv.aruco.drawDetectedMarkers(frame, corners, ids);
                }
                
                cv.imshow('canvas', frame);
                
                // Cleanup
                corners.delete(); ids.delete();
            } catch (err) {
                console.error("ArUco error: Is your opencv.js built with ArUco support?", err);
            }
            
            frame.delete(); gray.delete();
            requestAnimationFrame(processVideo);
        }

        startCamera();
    </script>
</body>
</html>
