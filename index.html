<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.rawgit.com/jcmellado/js-aruco/master/src/aruco.js"></script>
    <script src="https://cdn.rawgit.com/jcmellado/js-aruco/master/src/cv.js"></script>
</head>
<body>
    <video id="video" autoplay playsinline style="display:none"></video>
    <canvas id="canvas" style="transform: scaleX(-1);"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const detector = new AR.Detector();

        async function start() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { exact: 'environment' } } 
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                requestAnimationFrame(loop);
            };
        }

        function loop() {
            ctx.drawImage(video, 0, 0);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let markers = detector.detect(imageData);

            // Draw markers if detected
            for (let i = 0; i < markers.length; i++) {
                let m = markers[i];
                ctx.strokeStyle = "red";
                ctx.lineWidth = 3;
                ctx.strokeRect(m.corners[0].x, m.corners[0].y, 
                               m.corners[1].x - m.corners[0].x, 
                               m.corners[2].y - m.corners[1].y);
                console.log("Marker ID found:", m.id);
            }
            requestAnimationFrame(loop);
        }
        start();
    </script>
</body>
</html>
