<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Camera Fix</title>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        /* Attributes MUST match the HTML tags below for iOS to behave */
        video { width: 100%; max-width: 600px; transform: scaleX(-1); background: #333; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <button id="startBtn">START CAMERA</button>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', async () => {
            try {
                // Request camera with explicit constraints
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: 'environment' } } 
                });
                
                // Assign stream
                video.srcObject = stream;
                
                // Explicitly play and handle the promise
                await video.play();
                
                // Hide button only after playback starts
                startBtn.style.display = 'none';
            } catch (err) {
                alert("Camera Error: " + err.name + " - " + err.message);
            }
        });
    </script>
</body>
</html>
