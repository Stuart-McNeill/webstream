<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Camera Transmitter</title>
    <style>
        body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: -apple-system, sans-serif; }
        #container { position: relative; width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }
        video { width: 100%; border-radius: 12px; background: #222; display: block; }
        button { padding: 16px 32px; font-size: 18px; font-weight: bold; background: #007AFF; color: white; border: none; border-radius: 12px; cursor: pointer; margin-bottom: 20px; }
        .config-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; width: 90%; margin-top: 15px; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 8px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
    </style>
</head>
<body>

    <div id="container">
        <button id="startBtn">START TRANSMITTER</button>
        <video id="video" autoplay playsinline muted></video>
        
        <div class="config-box">
            <label id="ipLabel">Enter Computer's Local IP Address:</label>
            <input type="text" id="ipInput" value="192.168.1.100" placeholder="e.g., 192.168.1.X">
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const ipInput = document.getElementById('ipInput');
        let ws;
        let timer;

        // Load cached IP address if available
        if (localStorage.getItem('desktop_ip')) {
            ipInput.value = localStorage.getItem('desktop_ip');
        }

        startBtn.onclick = async () => {
            const targetIp = ipInput.value.trim();
            if (!targetIp) {
                alert("Please enter your computer's IP address first!");
                return;
            }
            localStorage.setItem('desktop_ip', targetIp);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                await video.play();
                startBtn.style.display = 'none';

                // Establish high-speed network socket pipeline to your desktop server
                ws = new WebSocket(`ws://${targetIp}:8765`);
                
                ws.onopen = () => {
                    console.log("Connected to desktop processing engine!");
                    startStreaming();
                };

                ws.onerror = (err) => {
                    alert("Could not connect to desktop script. Make sure your computer running Python is on the exact same Wi-Fi network and the script is running.");
                };

            } catch (err) {
                alert("Camera initialization failed: " + err.message);
            }
        };

        function startStreaming() {
            const hiddenCanvas = document.createElement('canvas');
            hiddenCanvas.width = 640;
            hiddenCanvas.height = 480;
            const hiddenCtx = hiddenCanvas.getContext('2d');

            // Send frames rapidly over the network loop
            timer = setInterval(() => {
                if (video.readyState === video.HAVE_ENOUGH_DATA && ws.readyState === WebSocket.OPEN) {
                    hiddenCtx.drawImage(video, 0, 0, 640, 480);
                    // Compress frame to low-latency JPEG compression matrix
                    hiddenCanvas.toBlob((blob) => {
                        ws.send(blob);
                    }, 'image/jpeg', 0.6); 
                }
            }, 50); // Streams at ~20 Frames Per Second
        }
    </script>
</body>
</html>
